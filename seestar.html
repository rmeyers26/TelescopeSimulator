<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<title>Seestar S50 Pro – Smart Telescope Simulator</title>
<link rel="stylesheet" href="css/seestar.css">
</head>
<body>
<!-- Top bar: back to the telescope chooser, clock, time speed, night mode -->
<header id="bar">
  <a class="b" href="index.html" title="Back to the telescope chooser">← Telescopes</a>
  <h1>Seestar S50 Pro <span class="mu">smart telescope simulator</span></h1>
  <span class="grow"></span>
  <span id="clock" class="mu"></span>
  <label class="mu" title="How fast simulated time runs. Faster = stacking finishes sooner.">Time
    <select id="speed" class="b sm">
      <option value="1">×1 (real time)</option><option value="10" selected>×10</option><option value="60">×60</option><option value="300">×300</option>
    </select></label>
  <label class="mu"><input type="checkbox" id="red"> 🔴 Night mode</label>
</header>

<main id="main">
  <!-- LEFT: the 3D model and the sky around it -->
  <section id="stage">
    <canvas id="gl"></canvas>
    <div id="views">
      <button class="b sm on" data-view="orbit">Orbit</button>
      <button class="b sm" data-view="front">Front</button>
      <button class="b sm" data-view="side">Side</button>
      <button class="b sm" data-view="top">Top</button>
      <button class="b sm" data-view="eye" title="Look at the sky from the telescope's own point of view">Scope's-eye</button>
      <button class="b sm" id="bBeam" title="Draw a line showing where the telescope is aiming">Aim line</button>
    </div>
    <div id="hud"></div>
    <div id="toast"></div>
  </section>

  <!-- RIGHT: the "phone app": live view on top, tabs underneath -->
  <aside id="app">
    <div id="live">
      <div id="lvwrap"><canvas id="lv" width="540" height="960"></canvas></div>
      <div id="lvbar">
        <span class="seg" id="camSeg"><button data-cam="tele" class="on">Tele</button><button data-cam="wide">Wide</button></span>
        <span class="seg" id="zoomSeg"><button data-zoom="1" class="on">1×</button><button data-zoom="2">2×</button><button data-zoom="4">4×</button></span>
      </div>
      <div id="lvact">
        <button id="shutter" title="Take a photo">●</button>
        <button id="recbtn" title="Record video">⏺</button>
      </div>
      <div id="liveMsg"></div>
    </div>
    <div id="chips"></div>
    <nav id="tabs"></nav>
    <div id="panes"></div>
  </aside>
</main>
<div id="redov"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Shared with the C11 simulator: astronomy math and object catalogs -->
<script src="js/01-core-astro.js"></script>
<script src="js/02-catalogs.js"></script>
<!-- Seestar-only scripts (load order matters – each uses the ones above it) -->
<script src="js/s50/s50-model.js"></script>
<script src="js/s50/s50-imaging.js"></script>
<script src="js/s50/s50-scene.js"></script>
<script src="js/s50/s50-app.js"></script>
<script src="js/s50/s50-live.js"></script>
</body>
</html>
